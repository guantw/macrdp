[package]
name = "macrdp-capture"
version = "0.1.0"
edition.workspace = true

[dependencies]
anyhow.workspace = true
tracing.workspace = true
bytes.workspace = true
tokio.workspace = true
screencapturekit = { version = "3.1.3", features = ["macos_14_0"] }
core-graphics = "0.25"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFString", "objc2"] }
